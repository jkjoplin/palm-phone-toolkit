<!doctype html>
<html lang="en" class="boot" data-view="idle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0604">
<title>Moods</title>
<script>
/* First thing, before anything that can fail (contract, section 3):
   - the shell heartbeat, every 5 s, whatever the connection state;
   - window.__shell, queueing shell events until app.js takes them;
   - --u, from the visible area (window.innerWidth/innerHeight, never viewport-height units).
   If app.js never finishes booting within 30 s (a load or script error), the heartbeat stops,
   so the shell's watchdog reloads the page instead of leaving a dead screen up. */
(function () {
  var t0 = Date.now();
  function beat() {
    if (!window.__moodsBooted && Date.now() - t0 > 30000) return;
    try { if (window.Shell && window.Shell.heartbeat) window.Shell.heartbeat(); } catch (e) {}
  }
  beat();
  setInterval(beat, 5000);
  var q = [];
  window.__shellQueue = q;
  window.__shell = function (type, payload) {
    try {
      if (window.__onShell) window.__onShell(type, payload);
      else { q.push([type, payload]); if (q.length > 40) q.shift(); }
    } catch (e) {}
  };
  function fit() {
    var u = Math.min(window.innerWidth / 360, window.innerHeight / 640);
    document.documentElement.style.setProperty('--u', (u > 0 ? u : 1) + 'px');
  }
  fit();
  window.__fitUnit = fit;
})();
</script>
<link rel="stylesheet" href="ember.css">
</head>
<body>
<div id="app">
  <div class="skies" id="skies"></div>
  <div class="nightdim"></div>
  <div class="vignette"></div>

  <div class="face" id="face">
    <div class="nightsky"></div>
    <div class="clock" id="clock"></div>
    <div class="face-glyph" id="faceGlyph"></div>
    <div class="status" id="status"></div>
    <div class="face-dots" id="faceDots"></div>
    <p class="face-note" id="faceNote"></p>
    <div class="health" id="health"></div>
    <div class="face-undo"><button class="undo" type="button" id="faceUndo"></button></div>
  </div>

  <div class="deck" id="deck">
    <div class="track" id="track"></div>
    <p class="empty" id="empty">No moods in Home Assistant yet.</p>
    <div class="topbar">
      <button class="back" type="button" id="backBtn"><svg viewBox="0 0 9 14" aria-hidden="true"><path d="M7 1.5 1.8 7 7 12.5"/></svg><span>Back to clock</span></button>
      <span class="tb-time" id="tbTime"></span>
    </div>
    <div class="pager" id="pager"></div>
  </div>

  <div class="grain"></div>
</div>
<script src="glyphs.js"></script>
<script src="moods.js"></script>
<script src="ha.js"></script>
<script src="sim.js"></script>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
