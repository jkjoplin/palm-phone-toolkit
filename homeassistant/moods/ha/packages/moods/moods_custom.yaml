  moods_custom_run:
    alias: "Moods: run a custom mood"
    description: "Runs the steps of the custom mood that is current. Called only by script.mood_custom_<n> after mood_begin accepted it."
    icon: mdi:playlist-play
    mode: parallel
    max: 10
    fields:
      slot:
        name: Slot
        required: true
        selector:
          number:
            min: 1
            max: 6
    sequence:
      # Tables and limits live inside the sequence, so caller data cannot override them.
      - variables:
          ROLES: {"Bedroom lamps": "light.role_bedroom_lamps", "Bedroom movie lamp": "light.role_bedroom_movie_lamp", "Office lights": "light.role_office_lights", "Loft lamp": "light.role_loft_lamp", "Living room lights": "light.role_living_room_lights", "Kitchen lights": "light.role_kitchen_lights", "Patio lights": "light.role_patio_lights", "Porch lights": "light.role_porch_lights", "Driveway lights": "light.role_driveway_lights"}
          DO: {"Soft white (2700 K)": ["white", 2700], "Warm white (2200 K)": ["white", 2200], "Candlelight (2000 K)": ["white", 2000], "Neutral white (4000 K)": ["white", 4000], "Daylight (5000 K)": ["white", 5000], "Cool daylight (6500 K)": ["white", 6500], "Amber": ["colour", [255, 140, 40]], "Deep red": ["colour", [150, 8, 6]], "Rose": ["colour", [255, 90, 120]], "Magenta": ["colour", [220, 40, 160]], "Violet": ["colour", [120, 60, 220]], "Blue": ["colour", [40, 80, 255]], "Teal": ["colour", [20, 170, 160]], "Green": ["colour", [60, 200, 80]], "Keep its colour": ["keep", 0], "Off": ["off", 0]}
          INDOOR: ["light.role_bedroom_lamps", "light.role_office_lights", "light.role_loft_lamp", "light.role_living_room_lights", "light.role_kitchen_lights"]
          OUTDOOR: ["light.role_patio_lights", "light.role_porch_lights", "light.role_driveway_lights"]
          BED_OK: ["off", 62, 64, 66, 68, 70]
          n: "{{ slot | default(0) | int(0) }}"
          slug: "{{ 'custom_' ~ n }}"
          card: |-
            {%- set c = state_attr('sensor.moods_custom_' ~ n, 'card') if 1 <= n <= 6 else none %}
            {{ c if c is mapping else {} }}
      # Only from inside its own running slot script, after mood_begin made it current,
      # never during vacation, and only for a ready card.
      - condition: template
        value_template: |-
          {{ 1 <= n <= 6
             and is_state('script.mood_' ~ slug, 'on')
             and states('input_text.house_mood') == slug
             and not is_state('input_boolean.vacation_mode', 'on')
             and card.get('mood') == true }}
      - variables:
          steps: |-
            {%- set ns = namespace(out=[]) %}
            {%- set raw = card.get('mood_steps') %}
            {%- for s in (raw if raw is list else [])[:4] if s is mapping and s.get('lights') in ROLES and s.get('do') in DO %}
              {%- set e = ROLES[s.get('lights')] %}{%- set act = DO[s.get('do')] %}
              {#- a role with no lights yet (or not loaded) is skipped: nothing to send it -#}
              {%- set m = state_attr(e, 'entity_id') %}
              {%- if 'guest_room' not in e and m is iterable and m is not string and m | count > 0 %}
                {%- set ns.out = ns.out + [{'e': e, 'kind': act[0], 'arg': act[1],
                                            'pct': [[s.get('pct') | int(0), 1] | max, 100] | min}] %}
              {%- endif %}
            {%- endfor %}
            {{ ns.out }}
          on_steps: "{{ steps | rejectattr('kind', 'eq', 'off') | list }}"
          lit: "{{ expand(on_steps | map(attribute='e') | list) | map(attribute='entity_id') | list }}"
          ex: "{{ card.get('mood_extras') if card.get('mood_extras') is mapping else {} }}"
          fade: "{{ [[ex.get('fade', 2) | int(2), 0] | max, 60] | min }}"
          others_mode: "{{ ex.get('others') if ex.get('others') in ['indoor', 'all'] else 'leave' }}"
          # The lights to turn off: the leaves of the "off" roles and of the other lights,
          # minus every leaf this mood lights (so a lamp in both is never blinked off).
          to_off: |-
            {%- set offroles = steps | selectattr('kind', 'eq', 'off') | map(attribute='e') | list %}
            {%- set extra = INDOOR if others_mode == 'indoor' else (['light.role_all_lights'] if others_mode == 'all' else []) %}
            {{ expand(offroles + extra) | map(attribute='entity_id') | reject('in', lit) | reject('search', 'guest_room') | unique | list }}
          tv: "{{ ex.get('tv') if ex.get('tv') in ['on', 'off'] else '' }}"
          scent: "{{ ex.get('scent') if ex.get('scent') in ['on', 'off'] else '' }}"
          bed: "{{ ex.get('bed') if ex.get('bed') in BED_OK else '' }}"
          lit_outdoor: "{{ on_steps | map(attribute='e') | select('in', OUTDOOR) | list | count > 0 }}"
      # What this run lights outdoors, for the 01:00 outdoor-off (moods_core.yaml): this
      # slot's slug when an "on" step lit an outdoor role, else empty. It is decided by
      # what ran, so later edits to the slot, or clearing it, do not change it.
      - action: input_text.set_value
        target:
          entity_id: input_text.custom_mood_lit_outdoor
        data:
          value: "{{ slug if lit_outdoor else '' }}"
        continue_on_error: true
      - parallel:
          - sequence:
              - if:
                  - condition: template
                    value_template: "{{ to_off | count > 0 }}"
                then:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ to_off }}"
                    data:
                      transition: "{{ fade }}"
                    continue_on_error: true
              - repeat:
                  for_each: "{{ on_steps }}"
                  sequence:
                    - choose:
                        - conditions: "{{ repeat.item.kind == 'white' }}"
                          sequence:
                            - action: light.turn_on
                              target:
                                entity_id: "{{ repeat.item.e }}"
                              data:
                                color_temp_kelvin: "{{ [[repeat.item.arg | int(2700), 2000] | max, 6500] | min }}"
                                brightness_pct: "{{ repeat.item.pct }}"
                                transition: "{{ fade }}"
                              continue_on_error: true
                        - conditions: "{{ repeat.item.kind == 'colour' and repeat.item.arg is list and repeat.item.arg | count == 3 }}"
                          sequence:
                            - action: light.turn_on
                              target:
                                entity_id: "{{ repeat.item.e }}"
                              data:
                                rgb_color: |-
                                  {%- set ns = namespace(c=[]) %}
                                  {%- for v in repeat.item.arg %}{%- set ns.c = ns.c + [[[v | int(0), 0] | max, 255] | min] %}{%- endfor %}
                                  {{ ns.c }}
                                brightness_pct: "{{ repeat.item.pct }}"
                                transition: "{{ fade }}"
                              continue_on_error: true
                      default:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ repeat.item.e }}"
                          data:
                            brightness_pct: "{{ repeat.item.pct }}"
                            transition: "{{ fade }}"
                          continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ tv == 'on' }}"
            then:
              - action: script.role_bedroom_tv_on
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ tv == 'off' }}"
            then:
              - action: script.role_bedroom_tv_off
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ scent == 'on' }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.role_diffuser
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ scent == 'off' }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.role_diffuser
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ bed == 'off' }}"
            then:
              - action: script.role_bed_off
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ bed is number }}"
            then:
              # the wrapper clamps to 60..75 again
              - action: script.role_bed_cool
                data:
                  temperature: "{{ bed }}"
                continue_on_error: true
  moods_custom_start:
    alias: "Moods: start a custom mood"
    description: "Fills an empty custom mood slot with a draft (\"New mood\", switched off). Does nothing to a slot that is in use."
    icon: mdi:plus-circle-outline
