automation:
  - id: moods_custom_save_soon
    alias: "Moods: save dashboard moods soon after an edit"
    description: "Dashboard edits are plain helper writes; this makes them survive a crash within seconds instead of 15 minutes."
    mode: restart
    triggers:
      # The card sensors change with every slot helper (a state trigger with no `to:`
      # also fires on attribute changes), plus every mood's placement helpers.
      - trigger: state
        entity_id:
          - "sensor.moods_custom_1"
          - "sensor.moods_custom_2"
          - "sensor.moods_custom_3"
          - "sensor.moods_custom_4"
          - "sensor.moods_custom_5"
          - "sensor.moods_custom_6"
          - "input_select.moods_afterglow_where"
          - "input_number.moods_afterglow_order"
          - "input_select.moods_away_where"
          - "input_number.moods_away_order"
          - "input_select.moods_focus_where"
          - "input_number.moods_focus_order"
          - "input_select.moods_good_morning_where"
          - "input_number.moods_good_morning_order"
          - "input_select.moods_hosting_where"
          - "input_number.moods_hosting_order"
          - "input_select.moods_lights_out_where"
          - "input_number.moods_lights_out_order"
          - "input_select.moods_movie_night_where"
          - "input_number.moods_movie_night_order"
          - "input_select.moods_showcase_where"
          - "input_number.moods_showcase_order"
          - "input_select.moods_wind_down_where"
          - "input_number.moods_wind_down_order"
          - "input_select.moods_custom_1_where"
          - "input_number.moods_custom_1_order"
          - "input_select.moods_custom_2_where"
          - "input_number.moods_custom_2_order"
          - "input_select.moods_custom_3_where"
          - "input_number.moods_custom_3_order"
          - "input_select.moods_custom_4_where"
          - "input_number.moods_custom_4_order"
          - "input_select.moods_custom_5_where"
          - "input_number.moods_custom_5_order"
          - "input_select.moods_custom_6_where"
          - "input_number.moods_custom_6_order"
    conditions:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable'] }}"
    actions:
      - delay:
          seconds: 10
      - action: homeassistant.save_persistent_states
        continue_on_error: true
