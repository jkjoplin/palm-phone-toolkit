# NOT mood: true. Old phone builds, and anything else that lists mood: true
# scripts, never see a slot; the new phones read mood_slot and the card sensor.
# A custom mood never holds the outdoor lights past 22:30.
homeassistant:
  customize:
    script.mood_custom_1:
      mood_slot: 1
      mood_holds_outdoor: false
    script.mood_custom_2:
      mood_slot: 2
      mood_holds_outdoor: false
    script.mood_custom_3:
      mood_slot: 3
      mood_holds_outdoor: false
    script.mood_custom_4:
      mood_slot: 4
      mood_holds_outdoor: false
    script.mood_custom_5:
      mood_slot: 5
      mood_holds_outdoor: false
    script.mood_custom_6:
      mood_slot: 6
      mood_holds_outdoor: false

# No entity-level variables: on these sensors (Home Assistant renders those once,
# when tracking starts), so the card body is written out in full twice.
template:
  - sensor:
      - unique_id: moods_custom_1
        default_entity_id: sensor.moods_custom_1
        # The picture chosen for the card, once the slot has a name (the icon is not a
        # capability: changing it never writes the entity registry).
        icon: |-
          {%- set n = states('input_text.custom_mood_1_name') | trim %}
          {{- 'mdi:palette-swatch-outline' if n in ['', 'unknown', 'unavailable'] else {"Ember": "mdi:fire", "Candle": "mdi:candle", "Curtain": "mdi:curtains", "Bulbs": "mdi:lightbulb-group", "Moon": "mdi:weather-night", "Sunrise": "mdi:weather-sunset-up", "Desk lamp": "mdi:desk-lamp", "Glasses": "mdi:glasses", "Key": "mdi:key-variant"}.get(states('input_select.custom_mood_1_glyph'), 'mdi:fire') }}
        name: |-
          {%- set n = states('input_text.custom_mood_1_name') | replace('|', ' ') | trim %}
          {%- set n = '' if n in ['', 'unknown', 'unavailable'] else n[:32] %}
          {%- if n == '' and not (is_state('input_boolean.custom_mood_1_on', 'on')
             or (states('input_text.custom_mood_1_tagline') | replace('|', ' ') | trim) not in ['', 'unknown', 'unavailable']
             or states('input_select.custom_mood_1_step_1_lights') not in ["No step", "", "unknown", "unavailable"]
             or states('input_select.custom_mood_1_step_2_lights') not in ["No step", "", "unknown", "unavailable"]
             or states('input_select.custom_mood_1_step_3_lights') not in ["No step", "", "unknown", "unavailable"]
             or states('input_select.custom_mood_1_step_4_lights') not in ["No step", "", "unknown", "unavailable"]
             or states('input_select.custom_mood_1_others') in ["Turn other indoor lights off", "Turn every other light off, outdoors too"]
             or states('input_select.custom_mood_1_tv') in ["Bedroom TV on", "Bedroom TV off"]
             or states('input_select.custom_mood_1_scent') in ["Diffuser on", "Diffuser off"]
             or states('input_select.custom_mood_1_bed') in ["Bed off", "Bed to 62 °F", "Bed to 64 °F", "Bed to 66 °F", "Bed to 68 °F", "Bed to 70 °F"]) %}Custom mood 1 (empty)
          {%- else %}{%- set n = n or 'Custom mood 1' %}
          {%- if not is_state('input_boolean.custom_mood_1_on', 'on') %}{{ n }} (switched off)
          {%- elif n[:1] in ['[', '{', '('] or n is match('^(none|true|false|[-+]?[0-9.][0-9._]*)$', ignorecase=true) %}{{ n ~ '\u200b' }}
          {%- else %}{{ n }}{% endif %}
          {%- endif %}
        state: |-
          {%- set N = 1 %}{%- set p = 'custom_mood_1_' %}
          {%- set ROLES = {"Bedroom lamps": ["light.role_bedroom_lamps", "Lamps", "Bedroom", 0], "Bedroom movie lamp": ["light.role_bedroom_movie_lamp", "Lamp", "Bedroom", 0], "Office lights": ["light.role_office_lights", "Office", "Office", 0], "Loft lamp": ["light.role_loft_lamp", "Loft", "Loft", 0], "Living room lights": ["light.role_living_room_lights", "Living", "Living room", 0], "Kitchen lights": ["light.role_kitchen_lights", "Kitchen", "Kitchen", 0], "Patio lights": ["light.role_patio_lights", "Patio", "Outdoors", 1], "Porch lights": ["light.role_porch_lights", "Porch", "Outdoors", 1], "Driveway lights": ["light.role_driveway_lights", "Drive", "Outdoors", 1]} %}
          {%- set DO = {"Soft white (2700 K)": ["white", 2700], "Warm white (2200 K)": ["white", 2200], "Candlelight (2000 K)": ["white", 2000], "Neutral white (4000 K)": ["white", 4000], "Daylight (5000 K)": ["white", 5000], "Cool daylight (6500 K)": ["white", 6500], "Amber": ["colour", [255, 140, 40]], "Deep red": ["colour", [150, 8, 6]], "Rose": ["colour", [255, 90, 120]], "Magenta": ["colour", [220, 40, 160]], "Violet": ["colour", [120, 60, 220]], "Blue": ["colour", [40, 80, 255]], "Teal": ["colour", [20, 170, 160]], "Green": ["colour", [60, 200, 80]], "Keep its colour": ["keep", 0], "Off": ["off", 0]} %}
          {%- set GLYPHS = {"Ember": "ember", "Candle": "candle", "Curtain": "curtain", "Bulbs": "bulbs", "Moon": "moon", "Sunrise": "sunrise", "Desk lamp": "desk_lamp", "Glasses": "glasses", "Key": "key"} %}
          {%- set PALETTES = {"Ember amber": {"base": "#130905", "glows": ["#d6742c", "#80341e", "#604670"], "accent": "#f2a65e", "ink": "#f8e8d4"}, "Cinema red": {"base": "#0a0304", "glows": ["#a81618", "#580a16", "#2e4684"], "accent": "#e8574c", "ink": "#f6e0da"}, "Dusk rose": {"base": "#110716", "glows": ["#ba387a", "#5c32a4", "#e67042"], "accent": "#f4917c", "ink": "#f8e4ec"}, "Night indigo": {"base": "#04050b", "glows": ["#b05c28", "#242c64", "#143044"], "accent": "#a9b6e6", "ink": "#dfe3f2"}, "Sunrise gold": {"base": "#160e09", "glows": ["#ea9840", "#546e96", "#f0be8c"], "accent": "#f6c27c", "ink": "#fcf0e2"}, "Daylight blue": {"base": "#0b1014", "glows": ["#3aa0e6", "#2a7cab", "#f0dcb0"], "accent": "#a8dcf6", "ink": "#eef6fa"}, "Garden brass": {"base": "#140d07", "glows": ["#c08a3e", "#7a2b2b", "#e0a458"], "accent": "#f0b866"}, "Steel night": {"base": "#06080c", "glows": ["#2f4766", "#1d2a38", "#8a5a2a"], "accent": "#8fb3d9"}, "Ocean teal": {"base": "#04090c", "glows": ["#1f7a86", "#123e5a", "#5a4a7a"], "accent": "#7cc9cf"}, "Forest green": {"base": "#060a05", "glows": ["#5f8a3a", "#2c4a26", "#7a5a2a"], "accent": "#a9cf7c"}} %}
          {%- set WINDOWS = {"Mornings (05:00 to 11:00)": ["05:00", "11:00"], "Daytime (08:00 to 18:00)": ["08:00", "18:00"], "Evenings (17:00 to 23:00)": ["17:00", "23:00"], "Late evening (20:00 to 02:00)": ["20:00", "02:00"], "Night (21:00 to 07:00)": ["21:00", "07:00"]} %}
          {%- set FADE = {"Usual (2 s)": 2, "Instant": 0, "Slow (10 s)": 10, "Very slow (30 s)": 30} %}
          {%- set OTHERS = {"Leave other lights alone": "leave", "Turn other indoor lights off": "indoor", "Turn every other light off, outdoors too": "all"} %}
          {%- set BED = {"Bed off": "off", "Bed to 62 °F": 62, "Bed to 64 °F": 64, "Bed to 66 °F": 66, "Bed to 68 °F": 68, "Bed to 70 °F": 70} %}
          {%- set BAD = ['', 'unknown', 'unavailable'] %}
          {%- set name = states('input_text.' ~ p ~ 'name') | replace('|', ' ') | trim %}{%- set name = '' if name in BAD else name[:32] %}
          {%- set tag = states('input_text.' ~ p ~ 'tagline') | replace('|', ' ') | trim %}{%- set tag = '' if tag in BAD else tag[:120] %}
          {%- set fade = FADE.get(states('input_select.' ~ p ~ 'fade'), 2) %}
          {%- set others = OTHERS.get(states('input_select.' ~ p ~ 'others'), 'leave') %}
          {%- set s = namespace(steps=[], words=[], touches=[], rooms=[], problems=[], outdoor=false, offs=[], used=false) %}
          {%- for k in range(1, 5) %}
            {%- set l = states('input_select.' ~ p ~ 'step_' ~ k ~ '_lights') %}
            {%- set d = states('input_select.' ~ p ~ 'step_' ~ k ~ '_do') %}
            {%- set pct = states('input_number.' ~ p ~ 'step_' ~ k ~ '_pct') | int(0) %}
            {%- if l not in ['No step'] + BAD %}{%- set s.used = true %}{%- endif %}
            {%- if l in ROLES and d in DO %}
              {%- set e = ROLES[l][0] %}{%- set kind = DO[d][0] %}
              {%- set members = state_attr(e, 'entity_id') %}
              {%- if kind != 'off' and not (1 <= pct <= 100) %}
                {%- set s.problems = s.problems + ['Step ' ~ k ~ ': brightness must be 1 to 100%, so it is skipped.'] %}
              {%- else %}
                {%- set s.steps = s.steps + [{'lights': l, 'do': d, 'pct': pct}] %}
                {%- set s.words = s.words + [l ~ (' off' if kind == 'off' else ' ' ~ (d[:1] | lower) ~ d[1:] ~ ', ' ~ pct ~ '%')] %}
                {%- set s.rooms = s.rooms + [ROLES[l][2]] %}
                {%- if members is not iterable or members is string or members | count == 0 %}
                  {%- set s.problems = s.problems + ['Step ' ~ k ~ ': ' ~ l ~ ' has no lights yet, so it does nothing.'] %}
                {%- elif kind == 'off' %}{%- set s.offs = s.offs + [[ROLES[l][1], e]] %}
                {%- elif e not in (s.touches | map(attribute='entity') | list) %}
                  {%- set s.touches = s.touches + [{'label': ROLES[l][1], 'entity': e, 'expect': 'on'}] %}
                {%- endif %}
                {%- if kind != 'off' and ROLES[l][3] == 1 %}{%- set s.outdoor = true %}{%- endif %}
              {%- endif %}
            {%- elif l not in ['No step'] + BAD %}
              {%- set s.problems = s.problems + ['Step ' ~ k ~ ': not understood, so it is skipped.'] %}
            {%- endif %}
          {%- endfor %}
          {%- set tv = {'Bedroom TV on': 'on', 'Bedroom TV off': 'off'}.get(states('input_select.' ~ p ~ 'tv')) %}
          {%- set scent = {'Diffuser on': 'on', 'Diffuser off': 'off'}.get(states('input_select.' ~ p ~ 'scent')) %}
          {%- set bed = BED.get(states('input_select.' ~ p ~ 'bed')) %}
          {#- text that is not one of a field's options (only input_select.set_options can put it there) -#}
          {%- for f in [["glyph", "Picture", ["Ember", "Candle", "Curtain", "Bulbs", "Moon", "Sunrise", "Desk lamp", "Glasses", "Key"]], ["colours", "Colours", ["Ember amber", "Cinema red", "Dusk rose", "Night indigo", "Sunrise gold", "Daylight blue", "Garden brass", "Steel night", "Ocean teal", "Forest green"]], ["window", "When it runs", ["Any time", "Mornings (05:00 to 11:00)", "Daytime (08:00 to 18:00)", "Evenings (17:00 to 23:00)", "Late evening (20:00 to 02:00)", "Night (21:00 to 07:00)"]], ["others", "Other lights", ["Leave other lights alone", "Turn other indoor lights off", "Turn every other light off, outdoors too"]], ["fade", "Fade", ["Usual (2 s)", "Instant", "Slow (10 s)", "Very slow (30 s)"]], ["tv", "Bedroom TV", ["Leave the TV alone", "Bedroom TV on", "Bedroom TV off"]], ["scent", "Diffuser", ["Leave the diffuser alone", "Diffuser on", "Diffuser off"]], ["bed", "The bed", ["Leave the bed alone", "Bed off", "Bed to 62 °F", "Bed to 64 °F", "Bed to 66 °F", "Bed to 68 °F", "Bed to 70 °F"]]] %}
            {%- if states('input_select.' ~ p ~ f[0]) not in f[2] + BAD %}
              {%- set s.problems = s.problems + [f[1] ~ ': not understood, so it uses ' ~ f[2][0] ~ '.'] %}
            {%- endif %}
          {%- endfor %}
          {#- an "off" mark only when the fade is quick enough for the phone's 8 s mark window -#}
          {%- if s.touches | count == 0 and s.offs | count > 0 and fade <= 2 %}
            {%- set s.touches = [{'label': s.offs[0][0], 'entity': s.offs[0][1], 'expect': 'off'}] %}
          {%- endif %}
          {%- if tv is not none %}{%- set s.touches = s.touches + [{'label': 'TV', 'entity': 'binary_sensor.role_bedroom_tv', 'expect': tv}] %}{%- endif %}
          {%- if scent is not none %}{%- set s.touches = s.touches + [{'label': 'Scent', 'entity': 'switch.role_diffuser', 'expect': scent}] %}{%- endif %}
          {%- if bed is number %}{%- set s.touches = s.touches + [{'label': 'Bed', 'entity': 'binary_sensor.role_bed', 'expect': 'on'}] %}
          {%- elif bed == 'off' %}{%- set s.touches = s.touches + [{'label': 'Bed', 'entity': 'binary_sensor.role_bed', 'expect': 'off'}] %}{%- endif %}
          {%- set actions = s.steps | count + ([tv, scent, bed] | reject('none') | list | count) + (0 if others == 'leave' else 1) %}
          {%- set on = is_state('input_boolean.' ~ p ~ 'on', 'on') %}
          {#- empty: nothing in it at all. A blank name alone never empties a slot (Start would wipe it) -#}
          {%- set used = on or tag != '' or s.used or actions > 0 %}
          {%- set st = 'empty' if not used else ('ready' if on and actions > 0 else 'not_ready') %}
          {%- set shown = name or 'Custom mood ' ~ N %}
          {%- if used and name == '' %}{%- set s.problems = s.problems + ['It has no name, so it shows as ' ~ shown ~ '.'] %}{%- endif %}
          {%- set reason = '' if st == 'ready' else ('That custom mood was cleared on the Moods dashboard.' if st == 'empty'
                else (shown ~ ' is switched off on the Moods dashboard.' if not on else shown ~ ' has nothing to do yet.')) %}
          {%- set summary = (s.words
                + ([] if others == 'leave' else (['Other indoor lights off'] if others == 'indoor' else ['Every other light off']))
                + ([] if tv is none else ['Bedroom TV ' ~ tv]) + ([] if scent is none else ['Diffuser ' ~ scent])
                + ([] if bed is none else (['Bed off'] if bed == 'off' else ['Bed to ' ~ bed ~ ' °F']))) | join('. ') %}
          {%- set w = WINDOWS.get(states('input_select.' ~ p ~ 'window')) %}
          {%- set rooms = s.rooms | unique | list %}
          {%- set card = {
                'mood': st == 'ready', 'mood_slot': N, 'mood_state': st, 'mood_reason': reason,
                'mood_name': shown, 'mood_tagline': tag or ((summary ~ '.') if summary else 'Nothing set yet.')[:120],
                'mood_status': (s.words | first | default(''))[:40],
                'mood_scope': rooms[0] if rooms | count == 1 else 'House',
                'mood_glyph': GLYPHS.get(states('input_select.' ~ p ~ 'glyph'), 'ember'),
                'mood_palette': PALETTES.get(states('input_select.' ~ p ~ 'colours'), PALETTES['Ember amber']),
                'mood_night': is_state('input_boolean.' ~ p ~ 'night', 'on'),
                'mood_window': none if w is none else {'from': w[0], 'to': w[1]},
                'mood_order': 100 + 10 * N, 'mood_panels': [],
                'mood_touches': s.touches[:5], 'mood_lights_outdoor': s.outdoor,
                'mood_steps': s.steps,
                'mood_extras': {'tv': tv, 'scent': scent, 'bed': bed, 'others': others, 'fade': fade},
                'mood_summary': summary, 'mood_problems': s.problems } %}
          {{- card.mood_state }}
        attributes:
          card: |-
            {%- set N = 1 %}{%- set p = 'custom_mood_1_' %}
            {%- set ROLES = {"Bedroom lamps": ["light.role_bedroom_lamps", "Lamps", "Bedroom", 0], "Bedroom movie lamp": ["light.role_bedroom_movie_lamp", "Lamp", "Bedroom", 0], "Office lights": ["light.role_office_lights", "Office", "Office", 0], "Loft lamp": ["light.role_loft_lamp", "Loft", "Loft", 0], "Living room lights": ["light.role_living_room_lights", "Living", "Living room", 0], "Kitchen lights": ["light.role_kitchen_lights", "Kitchen", "Kitchen", 0], "Patio lights": ["light.role_patio_lights", "Patio", "Outdoors", 1], "Porch lights": ["light.role_porch_lights", "Porch", "Outdoors", 1], "Driveway lights": ["light.role_driveway_lights", "Drive", "Outdoors", 1]} %}
            {%- set DO = {"Soft white (2700 K)": ["white", 2700], "Warm white (2200 K)": ["white", 2200], "Candlelight (2000 K)": ["white", 2000], "Neutral white (4000 K)": ["white", 4000], "Daylight (5000 K)": ["white", 5000], "Cool daylight (6500 K)": ["white", 6500], "Amber": ["colour", [255, 140, 40]], "Deep red": ["colour", [150, 8, 6]], "Rose": ["colour", [255, 90, 120]], "Magenta": ["colour", [220, 40, 160]], "Violet": ["colour", [120, 60, 220]], "Blue": ["colour", [40, 80, 255]], "Teal": ["colour", [20, 170, 160]], "Green": ["colour", [60, 200, 80]], "Keep its colour": ["keep", 0], "Off": ["off", 0]} %}
            {%- set GLYPHS = {"Ember": "ember", "Candle": "candle", "Curtain": "curtain", "Bulbs": "bulbs", "Moon": "moon", "Sunrise": "sunrise", "Desk lamp": "desk_lamp", "Glasses": "glasses", "Key": "key"} %}
            {%- set PALETTES = {"Ember amber": {"base": "#130905", "glows": ["#d6742c", "#80341e", "#604670"], "accent": "#f2a65e", "ink": "#f8e8d4"}, "Cinema red": {"base": "#0a0304", "glows": ["#a81618", "#580a16", "#2e4684"], "accent": "#e8574c", "ink": "#f6e0da"}, "Dusk rose": {"base": "#110716", "glows": ["#ba387a", "#5c32a4", "#e67042"], "accent": "#f4917c", "ink": "#f8e4ec"}, "Night indigo": {"base": "#04050b", "glows": ["#b05c28", "#242c64", "#143044"], "accent": "#a9b6e6", "ink": "#dfe3f2"}, "Sunrise gold": {"base": "#160e09", "glows": ["#ea9840", "#546e96", "#f0be8c"], "accent": "#f6c27c", "ink": "#fcf0e2"}, "Daylight blue": {"base": "#0b1014", "glows": ["#3aa0e6", "#2a7cab", "#f0dcb0"], "accent": "#a8dcf6", "ink": "#eef6fa"}, "Garden brass": {"base": "#140d07", "glows": ["#c08a3e", "#7a2b2b", "#e0a458"], "accent": "#f0b866"}, "Steel night": {"base": "#06080c", "glows": ["#2f4766", "#1d2a38", "#8a5a2a"], "accent": "#8fb3d9"}, "Ocean teal": {"base": "#04090c", "glows": ["#1f7a86", "#123e5a", "#5a4a7a"], "accent": "#7cc9cf"}, "Forest green": {"base": "#060a05", "glows": ["#5f8a3a", "#2c4a26", "#7a5a2a"], "accent": "#a9cf7c"}} %}
            {%- set WINDOWS = {"Mornings (05:00 to 11:00)": ["05:00", "11:00"], "Daytime (08:00 to 18:00)": ["08:00", "18:00"], "Evenings (17:00 to 23:00)": ["17:00", "23:00"], "Late evening (20:00 to 02:00)": ["20:00", "02:00"], "Night (21:00 to 07:00)": ["21:00", "07:00"]} %}
            {%- set FADE = {"Usual (2 s)": 2, "Instant": 0, "Slow (10 s)": 10, "Very slow (30 s)": 30} %}
            {%- set OTHERS = {"Leave other lights alone": "leave", "Turn other indoor lights off": "indoor", "Turn every other light off, outdoors too": "all"} %}
            {%- set BED = {"Bed off": "off", "Bed to 62 °F": 62, "Bed to 64 °F": 64, "Bed to 66 °F": 66, "Bed to 68 °F": 68, "Bed to 70 °F": 70} %}
