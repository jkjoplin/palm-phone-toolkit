script:
  mood_custom_1:
    alias: "Mood: Custom 1"
    icon: mdi:palette-swatch-outline
    mode: restart
    sequence:
      # Keep these two steps first, as in every mood.
      - action: script.mood_begin
        data:
          slug: "{{ this.entity_id | replace('script.mood_', '') }}"
        response_variable: begin
      - condition: template
        value_template: "{{ begin is mapping and begin.proceed | default(false) }}"
      # Awaited, not script.turn_on: when mood_begin stops this script for a newer
      # mood, the runner is stopped with it.
      - action: script.moods_custom_run
        data:
          slot: "{{ this.entity_id | replace('script.mood_custom_', '') | int(0) }}"
        continue_on_error: true
  mood_custom_2:
    alias: "Mood: Custom 2"
    icon: mdi:palette-swatch-outline
    mode: restart
    sequence:
      # Keep these two steps first, as in every mood.
      - action: script.mood_begin
        data:
          slug: "{{ this.entity_id | replace('script.mood_', '') }}"
        response_variable: begin
      - condition: template
