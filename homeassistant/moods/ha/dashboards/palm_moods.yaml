# Palm Moods: the "Moods" dashboard in Home Assistant (YAML mode, kept in git).
#
# Registered by `lovelace: dashboards: palm-moods` in
# packages/moods/moods_settings.yaml. Deployed to /config/dashboards/ (never
# under packages/: every .yaml there is loaded as a package).
# Built-in cards only. Edits to this file show on the next browser refresh,
# with no restart and no reload.
#
# What is on it:
#   Moods    now (current mood, since when, the last refusal), set a mood
#            (one button per mood, listed by hand, plus one per custom mood
#            that is ready; Showcase's only while that example mood is
#            installed), Undo; one small section per mood with its setting
#            and where it shows; safety; put everything back; how to add a mood
#   My moods the six custom mood slots; each opens its own subview (custom-1
#            to custom-6) to make, edit, try, place or clear that mood
#   Phones   night hours and day brightness for each Palm
#   Devices  which devices fill each role, and which are not answering
#
# The six subviews at the end of this file are GENERATED by
# ui/dev/gen-custom.js, between the marker comments. Do not edit them here:
# change the generator and run `node ui/dev/gen-custom.js --write`
# (ui/dev/lint.js fails if they differ).
#
# Rules for editing: no YAML anchors or merge keys (Home Assistant's loader
# warns on every override), and `content: |-` for any markdown with Jinja
# (`>-` folds the lines together). Every button that changes the house asks
# first, on both the tile and its icon.
title: Moods
views:
  # ==================================================================== Moods
  - title: Moods
    path: moods
    type: sections
    max_columns: 3
    sections:
      # ---- Now ------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Now
            heading_style: title
            icon: mdi:palette-outline
          - type: markdown
            text_only: true
            content: |-
              {%- set cur = states('input_text.house_mood') %}
              {%- set s = 'script.mood_' ~ cur %}
              {%- if states('script.mood_begin') in ['unknown', 'unavailable'] %}
              The Palm Moods package is not loaded.
              {%- elif cur in ['', 'unknown', 'unavailable'] %}
              No mood has been set yet.
              {%- else %}
              {%- set c = state_attr('sensor.moods_' ~ cur, 'card') if cur is match('^custom_[1-6]$') else none %}
              {%- set c = c if c is mapping else {} %}
              {%- set cleared = c.get('mood_state') == 'empty' %}
              {%- set name = ('Custom mood ' ~ cur[-1:] ~ ' (cleared since)') if cleared else (c.get('mood_name') or state_attr(s, 'mood_name') or cur | replace('_', ' ') | title) %}
              {%- set t = state_attr('input_datetime.house_mood_since', 'timestamp') | float(0) %}
              {%- set status = c.get('mood_status') or state_attr(s, 'mood_status') %}
              {%- set p = states('input_text.house_mood_previous') %}
              {%- set pc = state_attr('sensor.moods_' ~ p, 'card') if p is match('^custom_[1-6]$') else none %}
              {%- set pc = pc if pc is mapping else {} %}
              ## {{ name }}
              {{ 'It was cleared on the My moods tab after it was set. The lights are as it left them.' if cleared else (c.get('mood_tagline') or state_attr(s, 'mood_tagline') or '') }}

              {% if t > 0 %}Since {{ t | timestamp_custom('%H:%M') }}{% if t | timestamp_custom('%Y-%m-%d') != now().strftime('%Y-%m-%d') %} on {{ t | timestamp_custom('%a %-d %b') }}{% endif %}.{% endif %}{% if status and not cleared %} {{ status }}.{% endif %}
              {%- if p not in ['', 'unknown', 'unavailable'] %}
              Before that: {{ pc.get('mood_name') or state_attr('script.mood_' ~ p, 'mood_name') or p | replace('_', ' ') | title }}.
              {%- endif %}
              {%- endif %}
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.vacation_mode
                state: "on"
            content: >-
              <ha-alert alert-type="info">Vacation mode is on, so only Away
              can run.</ha-alert>
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: input_text.house_mood_notice
                state_not: ""
              - condition: state
                entity: input_text.house_mood_notice
                state_not: unknown
              - condition: state
                entity: input_text.house_mood_notice
                state_not: unavailable
            content: |-
              {%- set n = states('input_text.house_mood_notice').split('|') %}
              {%- if n | count >= 3 %}
              {%- set c = state_attr('sensor.moods_' ~ n[0], 'card') if n[0] is match('^custom_[1-6]$') else none %}
              {%- set name = (c.get('mood_name') if c is mapping else none) or state_attr('script.mood_' ~ n[0], 'mood_name') or n[0] | replace('_', ' ') | title %}
              {%- set t = as_timestamp(n[1], 0) %}
              <ha-alert alert-type="warning" title="Last request refused">{{ n[2:] | join('|') }}<br>{{ name }} was asked for{% if t > 0 %} at {{ t | timestamp_custom('%H:%M') }}{% endif %}.</ha-alert>
              {%- endif %}
          - type: heading
            heading: Set a mood
            heading_style: subtitle
          - type: tile
            entity: script.mood_wind_down
            name: Wind Down
            icon: mdi:candle
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_wind_down
              confirmation:
                text: Set the house to Wind Down now? The bedroom lamps go low and the diffuser comes on.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_wind_down
              confirmation:
                text: Set the house to Wind Down now? The bedroom lamps go low and the diffuser comes on.
            hold_action:
              action: none
          - type: tile
            entity: script.mood_movie_night
            name: Movie Night
            icon: mdi:movie-open-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_movie_night
              confirmation:
                text: Set the house to Movie Night now? The bedroom TV comes on and the other bedroom lamps go off.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_movie_night
              confirmation:
                text: Set the house to Movie Night now? The bedroom TV comes on and the other bedroom lamps go off.
            hold_action:
              action: none
          - type: tile
            entity: script.mood_afterglow
            name: Afterglow
            icon: mdi:string-lights
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_afterglow
              confirmation:
                text: Set the house to Afterglow now? The loft and the patio light up in colour.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_afterglow
              confirmation:
                text: Set the house to Afterglow now? The loft and the patio light up in colour.
            hold_action:
              action: none
          - type: tile
            entity: script.mood_lights_out
            name: Lights Out
            icon: mdi:weather-night
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_lights_out
              confirmation:
                text: Set the house to Lights Out now? Every light in the house goes off (not the guest room), and the TV too.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_lights_out
              confirmation:
                text: Set the house to Lights Out now? Every light in the house goes off (not the guest room), and the TV too.
            hold_action:
              action: none
          - type: tile
            entity: script.mood_good_morning
            name: Good Morning
            icon: mdi:weather-sunset-up
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_good_morning
              confirmation:
                text: Set the house to Good Morning now? The bedroom lamps start to rise. It only runs from 05:00 to 11:00.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_good_morning
              confirmation:
                text: Set the house to Good Morning now? The bedroom lamps start to rise. It only runs from 05:00 to 11:00.
            hold_action:
              action: none
          - type: tile
            entity: script.mood_focus
            name: Focus
            icon: mdi:desk-lamp
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_focus
              confirmation:
                text: Set the house to Focus now? Only the office lights change.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_focus
              confirmation:
                text: Set the house to Focus now? Only the office lights change.
            hold_action:
              action: none
          - type: tile
            entity: script.mood_hosting
            name: Hosting
            icon: mdi:glass-wine
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_hosting
              confirmation:
                text: Set the house to Hosting now? The patio and the porch light up.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_hosting
              confirmation:
                text: Set the house to Hosting now? The patio and the porch light up.
            hold_action:
              action: none
          # Showcase is an optional example mood (packages/moods/showcase.yaml);
          # its button shows only while that mood exists (a script is "on" or
          # "off"; a missing one is neither), so deleting the file hides it.
          - type: tile
            entity: script.mood_showcase
            name: Showcase
            icon: mdi:palette
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: script.mood_showcase
                state:
                  - "on"
                  - "off"
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_showcase
              confirmation:
                text: Set the house to Showcase now? Only the office lamp changes, to its next colour.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_showcase
              confirmation:
                text: Set the house to Showcase now? Only the office lamp changes, to its next colour.
            hold_action:
              action: none
          - type: tile
            entity: script.mood_away
            name: Away
            icon: mdi:home-export-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_away
              confirmation:
                text: Set the house to Away now? Everything goes off and the heating goes to eco. The guest room lamp goes off too, unless "Leave the guest room alone" is on.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_away
              confirmation:
                text: Set the house to Away now? Everything goes off and the heating goes to eco. The guest room lamp goes off too, unless "Leave the guest room alone" is on.
            hold_action:
              action: none
          # The custom moods (My moods tab): one tile each, shown only while it is
          # ready. The tile takes the mood's name and picture from its card sensor
          # (a confirmation cannot name it: confirmation text is fixed).
          - type: tile
            entity: sensor.moods_custom_1
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: sensor.moods_custom_1
                state: ready
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_1
              confirmation:
                text: Set the house to the custom mood in slot 1 now? It does what its card on the My moods tab says.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_1
              confirmation:
                text: Set the house to the custom mood in slot 1 now? It does what its card on the My moods tab says.
            hold_action:
              action: none
          - type: tile
            entity: sensor.moods_custom_2
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: sensor.moods_custom_2
                state: ready
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_2
              confirmation:
                text: Set the house to the custom mood in slot 2 now? It does what its card on the My moods tab says.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_2
              confirmation:
                text: Set the house to the custom mood in slot 2 now? It does what its card on the My moods tab says.
            hold_action:
              action: none
          - type: tile
            entity: sensor.moods_custom_3
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: sensor.moods_custom_3
                state: ready
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_3
              confirmation:
                text: Set the house to the custom mood in slot 3 now? It does what its card on the My moods tab says.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_3
              confirmation:
                text: Set the house to the custom mood in slot 3 now? It does what its card on the My moods tab says.
            hold_action:
              action: none
          - type: tile
            entity: sensor.moods_custom_4
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: sensor.moods_custom_4
                state: ready
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_4
              confirmation:
                text: Set the house to the custom mood in slot 4 now? It does what its card on the My moods tab says.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_4
              confirmation:
                text: Set the house to the custom mood in slot 4 now? It does what its card on the My moods tab says.
            hold_action:
              action: none
          - type: tile
            entity: sensor.moods_custom_5
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: sensor.moods_custom_5
                state: ready
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_5
              confirmation:
                text: Set the house to the custom mood in slot 5 now? It does what its card on the My moods tab says.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_5
              confirmation:
                text: Set the house to the custom mood in slot 5 now? It does what its card on the My moods tab says.
            hold_action:
              action: none
          - type: tile
            entity: sensor.moods_custom_6
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: sensor.moods_custom_6
                state: ready
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_6
              confirmation:
                text: Set the house to the custom mood in slot 6 now? It does what its card on the My moods tab says.
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_custom_6
              confirmation:
                text: Set the house to the custom mood in slot 6 now? It does what its card on the My moods tab says.
            hold_action:
              action: none
          - type: tile
            entity: script.mood_undo
            name: Undo (back to the mood before)
            icon: mdi:undo-variant
            hide_state: true
            vertical: false
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: input_text.house_mood_previous
                state_not: ""
              - condition: state
                entity: input_text.house_mood_previous
                state_not: unknown
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_undo
              confirmation:
                text: Go back to the mood before this one?
            icon_tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.mood_undo
              confirmation:
                text: Go back to the mood before this one?
            hold_action:
              action: none

      # ---- Wind Down ------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Wind Down
            heading_style: title
            icon: mdi:candle
          - type: markdown
            text_only: true
            content: |-
              {{ state_attr('script.mood_wind_down', 'mood_tagline') or '' }}
          - type: tile
            entity: input_select.moods_wind_down_look
            name: Bedroom lamps
            icon: mdi:lamp-outline
            hide_state: true
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: 12
          # Shown only while "Custom (sliders below)" is chosen. Each slider spans
          # exactly the range the mood accepts (lint.js).
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.moods_wind_down_look
                state: "Custom (sliders below)"
            card:
              type: entities
              show_header_toggle: false
              entities:
                - entity: input_number.moods_wind_down_look_1
                  name: "Brightness"
                - entity: input_number.moods_wind_down_look_2
                  name: "Colour"
          - type: markdown
            text_only: true
            content: >-
              Only the bedroom lamps change. The diffuser still comes on.
              Custom: brightness 10 to 50%, colour 2000 to 3000 K (lower is
              warmer).
          - type: tile
            entity: input_select.moods_wind_down_where
            name: Where it shows
            icon: mdi:cellphone-cog
            hide_state: true
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: 12
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_number.moods_wind_down_order
                name: Order in the deck (0 = usual)

      # ---- Movie Night ----------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Movie Night
            heading_style: title
            icon: mdi:movie-open-outline
          - type: markdown
            text_only: true
            content: |-
              {{ state_attr('script.mood_movie_night', 'mood_tagline') or '' }}
          - type: tile
            entity: input_select.moods_movie_night_look
            name: The red lamp
            icon: mdi:lamp
            hide_state: true
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: 12
          # Shown only while "Custom (sliders below)" is chosen. Each slider spans
          # exactly the range the mood accepts (lint.js).
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.moods_movie_night_look
                state: "Custom (sliders below)"
            card:
              type: entities
              show_header_toggle: false
              entities:
                - entity: input_number.moods_movie_night_look_1
                  name: "Brightness"
          - type: markdown
            text_only: true
            content: >-
              The one bedroom lamp left on while the TV plays. Every other
              bedroom lamp goes off. Custom: brightness 1 to 20%.
          - type: tile
            entity: input_select.moods_movie_night_where
            name: Where it shows
            icon: mdi:cellphone-cog
            hide_state: true
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: 12
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_number.moods_movie_night_order
                name: Order in the deck (0 = usual)

      # ---- Afterglow ------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Afterglow
            heading_style: title
            icon: mdi:string-lights
          - type: markdown
            text_only: true
            content: |-
              {{ state_attr('script.mood_afterglow', 'mood_tagline') or '' }}
          - type: tile
            entity: input_select.moods_afterglow_look
            name: Loft and patio
            icon: mdi:string-lights
            hide_state: true
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: 12
          # Shown only while "Custom (sliders below)" is chosen. Each slider spans
          # exactly the range the mood accepts (lint.js).
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.moods_afterglow_look
                state: "Custom (sliders below)"
            card:
              type: entities
              show_header_toggle: false
              entities:
                - entity: input_number.moods_afterglow_look_1
                  name: "Loft"
                - entity: input_number.moods_afterglow_look_2
                  name: "Patio"
          - type: markdown
            text_only: true
            content: >-
              The Govee scene "Sunset Glow" where the light has it, otherwise a
              warm colour, at these levels. The patio goes off at 01:00 if
              Afterglow is still the mood. Custom: loft 10 to 80%, patio 10
              to 100%.
          - type: tile
            entity: input_select.moods_afterglow_where
            name: Where it shows
            icon: mdi:cellphone-cog
            hide_state: true
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: 12
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_number.moods_afterglow_order
                name: Order in the deck (0 = usual)

      # ---- Lights Out -----------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Lights Out
            heading_style: title
            icon: mdi:weather-night
          - type: markdown
            text_only: true
            content: |-
              {{ state_attr('script.mood_lights_out', 'mood_tagline') or '' }}
          - type: tile
            entity: input_select.moods_lights_out_bed
            name: The bed
            icon: mdi:bed-outline
            hide_state: true
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: 12
          # Shown only while "Custom (sliders below)" is chosen. Each slider spans
          # exactly the range the mood accepts (lint.js).
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.moods_lights_out_bed
                state: "Custom (sliders below)"
            card:
              type: entities
              show_header_toggle: false
              entities:
                - entity: input_number.moods_lights_out_bed_1
                  name: "The bed"
          - type: markdown
            text_only: true
            content: >-
              Custom: the slider goes from 62 to 70 °F. Separately, the bed is
              always kept between 60 and 75 °F, whatever is chosen here.
          - type: tile
            entity: input_select.moods_lights_out_where
            name: Where it shows
            icon: mdi:cellphone-cog
            hide_state: true
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: 12
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_number.moods_lights_out_order
                name: Order in the deck (0 = usual)

      # ---- Good Morning ---------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Good Morning
            heading_style: title
            icon: mdi:weather-sunset-up
          - type: markdown
            text_only: true
