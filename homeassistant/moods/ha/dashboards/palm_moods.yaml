  # ================================================================== Devices
  - title: Devices
    path: devices
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Which devices each role uses
            heading_style: title
            icon: mdi:lightbulb-group-outline
          - type: markdown
            text_only: true
            content: |-
              {%- set ns = namespace(n=0, bad=0, lines=[]) %}
              {%- for r in (states.light | list) + (states.switch | list) + (states.media_player | list)
                    if r.object_id.startswith('role_') and r.entity_id != 'light.role_all_lights' %}
              {%- set label = r.name | replace('Role: ', '') %}
              {%- set members = r.attributes.entity_id | default([]) %}
              {%- set ns2 = namespace(parts=[]) %}
              {%- for m in members %}
              {%- set ns.n = ns.n + 1 %}
              {%- set st = states(m) %}
              {%- if st in ['unknown', 'unavailable'] %}
              {%- set ns.bad = ns.bad + 1 %}
              {%- set ns2.parts = ns2.parts + [(state_attr(m, 'friendly_name') or m) ~ ' (**not answering**)'] %}
              {%- else %}
              {%- set ns2.parts = ns2.parts + [(state_attr(m, 'friendly_name') or m) ~ ' (' ~ st ~ ')'] %}
              {%- endif %}
              {%- endfor %}
              {%- set ns.lines = ns.lines + ['- **' ~ label ~ '**: ' ~ (ns2.parts | join(', ') if ns2.parts else '*nothing yet; moods skip it*')] %}
              {%- endfor %}
              {%- if ns.lines | count == 0 %}
              No roles found. Is the Palm Moods package loaded?
              {%- else %}
              {%- if ns.bad == 0 %}
              All {{ ns.n }} devices in the roles are answering.
              {%- else %}
              {{ ns.bad }} of {{ ns.n }} devices are not answering. Moods skip them and carry on.
              {%- endif %}

              {{ ns.lines | join('\n') }}
              {%- endif %}
      - type: grid
        cards:
          - type: heading
            heading: Bed, TV and heating
            heading_style: title
            icon: mdi:bed-outline
          - type: tile
            entity: binary_sensor.role_bed
            name: Bed is cooling
            icon: mdi:snowflake-thermometer
            grid_options:
              columns: 12
          - type: tile
            entity: binary_sensor.role_bedroom_tv
            name: Bedroom TV
            icon: mdi:television
            grid_options:
              columns: 12
          - type: tile
            entity: binary_sensor.role_thermostat_eco
            name: Heating in eco
            icon: mdi:leaf
            grid_options:
              columns: 12
          - type: markdown
            text_only: true
            content: >-
              Moods name rooms (roles), never devices. To add, swap or remove a
              device, edit its role in `packages/moods/moods_roles.yaml` (in
              git), then reload groups. No mood changes.

  # >>> generated by ui/dev/gen-custom.js
  # Do not edit between these markers: change ui/dev/gen-custom.js and run
  # `node ui/dev/gen-custom.js --write` (lint.js checks they match).
  - title: "Custom mood 1"
    path: custom-1
    subview: true
    back_path: /palm-moods/my-moods
    type: sections
    max_columns: 3
    sections:
      - type: grid
        visibility:
          - condition: state
            entity: sensor.moods_custom_1
            state: empty
        cards:
          - type: heading
            heading: "Custom mood 1"
            heading_style: title
            icon: mdi:palette-swatch-outline
          - type: markdown
            text_only: true
            content: "This slot is empty. Start it to get a draft called \"New mood\" that lights the bedroom lamps soft white at 40%. It stays switched off, and off the phones, until you switch it on."
          - type: button
            name: "Start this mood"
            icon: mdi:plus-circle-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.moods_custom_start
              data:
                slot: 1
            hold_action:
              action: none
            grid_options:
              columns: 12
      - type: grid
        visibility:
          - condition: state
            entity: sensor.moods_custom_1
            state_not: empty
        cards:
          - type: heading
            heading: Card
            heading_style: title
            icon: mdi:card-text-outline
          - type: markdown
            text_only: true
            content: |-
              {%- set c = state_attr('sensor.moods_custom_1', 'card') %}
              {%- if c is not mapping %}
              This mood's card cannot be read right now. The phones keep showing what they had, and asking for this mood is refused until it can be read.
              {%- else %}
              {%- set ICON = {"ember": "mdi:fire", "candle": "mdi:candle", "curtain": "mdi:curtains", "bulbs": "mdi:lightbulb-group", "moon": "mdi:weather-night", "sunrise": "mdi:weather-sunset-up", "desk_lamp": "mdi:desk-lamp", "glasses": "mdi:glasses", "key": "mdi:key-variant"} %}
              {%- set pal = c.get('mood_palette') if c.get('mood_palette') is mapping else {} %}
              {%- set w = c.get('mood_window') %}
              {%- set probs = c.get('mood_problems') if c.get('mood_problems') is list else [] %}
              {%- set g = pal.get('glows') if pal.get('glows') is list else [] %}
              ## <ha-icon icon="{{ ICON.get(c.get('mood_glyph'), 'mdi:fire') }}"></ha-icon> {{ c.get('mood_name') }}
              {%- if c.get('mood_state') == 'ready' %}
              **Ready.** It shows on the phones (as Where it shows allows) and under Set a mood.
              {%- else %}
              **Not ready.** {{ c.get('mood_reason') }}{% if not is_state('input_boolean.custom_mood_1_on', 'on') %} Turn on Switched on, just below, to make it ready.{% endif %}
              {%- endif %}
              {%- if is_state('input_text.house_mood', 'custom_1') %}

              **It is the house's mood now.** Undo, below, goes back to the mood before.
              {%- endif %}

              **Card:** {{ c.get('mood_tagline') }}

              **Does:** {{ (c.get('mood_summary') ~ '.') if c.get('mood_summary') else 'nothing yet.' }}
              {%- if w is mapping %} Runs only from {{ w.get('from') }} to {{ w.get('to') }}.{% else %} Runs at any time.{% endif %}
              {%- for p in probs %}
              - {{ p }}
              {%- endfor %}

              {% for col in [pal.get('base')] + g + [pal.get('accent')] if col is string %}<font color="{{ col }}">■</font>{% endfor %} {{ states('input_select.custom_mood_1_colours') }}
              {%- endif %}
          - type: entities
            show_header_toggle: false
